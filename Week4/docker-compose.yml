# Run from repo root:  docker compose -f Week4/docker-compose.yml up -d --build
services:
  api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: phoenix-api:${IMAGE_TAG:-latest}
    environment:
      - APP_ENV=${APP_ENV:-dev}
    expose: ["5000"]            # internal only; reachable via nginx
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks: [backend]

  proxy:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy   # nginx starts only after api is healthy
    restart: unless-stopped
    networks: [backend]

networks:
  backend:
